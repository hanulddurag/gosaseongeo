<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가나다순 고사성어 사전</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #F9F7F1; /* 전통 한지 느낌의 배경색 */
            color: #2D2A26; /* 먹물 느낌의 폰트 색상 */
        }
        .hanja-text {
            font-family: 'Noto Serif KR', serif;
        }
        /* 커스텀 스크롤바 디자인 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F0EBE1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #D4C9B3; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #B8A88A; 
        }
        .nav-item.active {
            background-color: #8C7A5E;
            color: white;
            font-weight: 600;
        }
        .prose-text {
            text-align: justify;
            word-break: keep-all;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- 상단 글로벌 네비게이션 바 -->
    <header class="bg-[#4A4133] text-[#F9F7F1] sticky top-0 z-50 shadow-md">
        <div class="max-w-5xl mx-auto flex">
            <button id="tab-dictionary" onclick="switchTab('dictionary')" class="flex-1 py-4 md:py-5 font-bold text-lg md:text-xl border-b-4 border-[#D4C9B3] transition-all">
                📖 고사성어 사전
            </button>
            <button id="tab-game" onclick="switchTab('game')" class="flex-1 py-4 md:py-5 font-bold text-lg md:text-xl border-b-4 border-transparent opacity-60 hover:opacity-100 transition-all">
                🧩 십자말 풀이 게임
            </button>
        </div>
    </header>

    <!-- 1. 고사성어 사전 뷰 -->
    <div id="dictionary-view" class="flex flex-col md:flex-row flex-1 w-full">
        <!-- 왼쪽 목차 네비게이션 -->
        <aside class="w-full md:w-64 bg-[#EFE9DB] border-b md:border-b-0 md:border-r border-[#D4C9B3] sticky top-[68px] md:top-[76px] h-auto md:h-[calc(100vh-76px)] overflow-y-hidden md:overflow-y-auto z-10 shadow-sm md:shadow-none">
            <div class="p-4 md:p-6 flex md:flex-col gap-2 overflow-x-auto md:overflow-x-hidden no-scrollbar" id="index-nav">
                <!-- 목차 버튼들이 JS로 생성됩니다 -->
            </div>
        </aside>

        <!-- 오른쪽 상세 내용 영역 -->
        <main class="flex-1 p-4 md:p-8 md:pl-12 max-w-4xl mx-auto h-[calc(100vh-68px)] md:h-[calc(100vh-76px)] overflow-y-auto">
            <div id="content-area">
                <!-- 자음별 섹션과 카드가 JS로 생성됩니다 -->
            </div>
            
            <div class="mt-16 pt-8 border-t border-[#D4C9B3] text-center text-[#8C7A5E] text-sm">
                <p>총 425개의 사자성어가 수록되어 있습니다.</p>
            </div>
        </main>
    </div>

    <!-- 2. 십자말 풀이 게임 뷰 -->
    <div id="game-view" class="hidden flex-col flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-[#4A4133] hanja-text mb-2">십자말 풀이 게임</h2>
            <p class="text-[#7A6F5D]">가로세로 힌트를 읽고 알맞은 사자성어를 완성해 보세요.</p>
        </div>

        <!-- 게임 세트 선택 버튼 -->
        <div class="flex flex-wrap justify-center gap-2 mb-8" id="game-set-selector">
            <!-- 버튼이 JS로 생성됩니다 -->
        </div>

        <div class="flex flex-col lg:flex-row gap-8 items-start">
            <!-- 십자말 풀이 보드 -->
            <div class="w-full lg:w-1/2 bg-white p-4 md:p-6 rounded-xl shadow-sm border border-[#D4C9B3]">
                <div id="crossword-grid" class="grid gap-0 border-t border-l border-[#8C7A5E] bg-[#F9F7F1]" style="grid-template-columns: repeat(14, minmax(0, 1fr))">
                    <!-- 그리드 셀이 JS로 생성됩니다 -->
                </div>
                
                <div class="mt-6 flex justify-end gap-3">
                    <button onclick="checkAnswers()" class="px-6 py-2 bg-[#8C7A5E] text-white rounded font-medium hover:bg-[#7A6F5D] transition-colors">정답 확인</button>
                    <button onclick="showAnswers()" class="px-6 py-2 border border-[#8C7A5E] text-[#8C7A5E] rounded font-medium hover:bg-[#F0EBE1] transition-colors">정답 보기</button>
                </div>
            </div>

            <!-- 힌트 영역 -->
            <div class="w-full lg:w-1/2 flex flex-col sm:flex-row gap-6">
                <!-- 가로 열쇠 -->
                <div class="flex-1 bg-white p-5 rounded-xl shadow-sm border border-[#EFE9DB]">
                    <h3 class="text-xl font-bold text-[#2D2A26] mb-4 border-b-2 border-[#8C7A5E] pb-2 inline-block">가로 열쇠</h3>
                    <ul id="clues-across" class="space-y-4 text-sm md:text-base text-[#4A4133] leading-relaxed">
                        <!-- 가로 힌트가 JS로 생성됩니다 -->
                    </ul>
                </div>
                <!-- 세로 열쇠 -->
                <div class="flex-1 bg-white p-5 rounded-xl shadow-sm border border-[#EFE9DB]">
                    <h3 class="text-xl font-bold text-[#2D2A26] mb-4 border-b-2 border-[#8C7A5E] pb-2 inline-block">세로 열쇠</h3>
                    <ul id="clues-down" class="space-y-4 text-sm md:text-base text-[#4A4133] leading-relaxed">
                        <!-- 세로 힌트가 JS로 생성됩니다 -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 상세한 유래가 있는 주요 고사성어 데이터 (명사형 종결 적용)
        const idiomsData = [
            {
                name: "가렴주구",
                hanja: "苛斂誅求",
                meaning: "가혹하게 세금을 거두어 백성을 괴롭힘",
                origin: "춘추시대 노나라의 실권자 계손씨가 백성들에게 무거운 세금을 징수하자, 공자가 이를 비판하며 제자들에게 일깨워준 고사에서 유래함. 공자가 제자들과 태산 근처를 지나가다 무덤 앞에서 애절하게 우는 여인을 발견함. 사연을 물으니 호랑이에게 시아버지, 남편, 그리고 아들까지 모두 잃었다고 함. 공자가 '그렇다면 왜 이곳을 떠나지 않느냐'고 묻자 여인은 '이곳에는 가혹한 정치가 없기 때문입니다'라고 답함. 이에 공자는 제자들을 돌아보며 '가혹한 정치는 호랑이보다 무섭다(가정맹어호)'라고 깊이 탄식함. 백성의 고혈을 짜내는 부패한 권력과 탐관오리의 폭정을 강하게 비판할 때 주로 사용되는 사자성어임. 국가의 근본인 백성을 돌보지 않는 정치의 위험성을 경고하는 역사적 교훈을 담고 있음."
            },
            {
                name: "가인박명",
                hanja: "佳人薄命",
                meaning: "미인은 불행하거나 병약하여 일찍 죽음",
                origin: "중국 북송 시대의 최고 문장가였던 소동파(蘇東坡)가 지은 '박명가인(薄命佳人)'이라는 시에서 유래함. 소동파가 절에 머물 때, 나이가 여든이 넘은 아름다운 비구니를 보고 그녀의 파란만장했던 젊은 시절을 상상하며 시를 지음. 시구 중에 '아름다운 뺨을 가진 두 여아는 늙기 십상이고, 아름다운 여인은 흔히 운명이 기구하다(雙頰向人多薄命)'라는 구절이 있음. 예로부터 외모가 빼어난 여인들은 많은 사람들의 시기와 질투를 받거나 권력자들의 암투에 휘말려 평탄치 못한 삶을 사는 경우가 많았음을 빗댄 표현임. 양귀비, 장희빈 등 역사 속 미인들의 비극적인 최후가 이를 대변함. 현대에 와서는 재주가 뛰어나거나 훌륭한 인품을 가진 사람이 뜻을 다 펼치지 못하고 일찍 요절할 때 안타까움을 표현하는 말로도 쓰임."
            },
            {
                name: "각주구검",
                hanja: "刻舟求劍",
                meaning: "융통성 없이 낡은 생각을 고집함",
                origin: "시대의 변화를 깨닫지 못하고 낡은 관습이나 생각만을 고집하는 어리석음을 비판하는 성어임. 춘추전국시대 초나라의 한 사람이 배를 타고 강을 건너다 실수로 소중한 칼을 물에 빠뜨림. 그는 당황하지 않고 주머니칼을 꺼내어 칼이 떨어진 배의 옆면에 표시를 해두었음. 이윽고 배가 강 건너 나루터에 도착하자, 그는 자신이 표시해 둔 뱃전 아래의 물속으로 뛰어들어 칼을 찾으려 함. 강물과 함께 배가 이동했다는 사실을 전혀 인지하지 못한 채, 정지된 공간의 표시만 믿은 것임. 여씨춘추에 기록된 이 우화는 상황이 끊임없이 변하는데도 과거의 법이나 규칙만을 맹목적으로 따르는 사람들을 꼬집음. 급변하는 사회에서 유연한 사고와 상황 대처 능력이 얼마나 중요한지를 역설적으로 보여주는 훌륭한 교훈임."
            },
            {
                name: "간담상조",
                hanja: "肝膽相照",
                meaning: "서로 속마음을 털어놓고 친하게 사귐",
                origin: "서로 마음속 깊은 곳까지 숨김없이 털어놓고 사귀는 진실한 우정을 의미함. 당나라 시대의 위대한 문장가였던 한유가 그의 벗 유종원의 묘지명에 쓴 글에서 유래함. 한유는 글에서 '사람은 어려운 처지에 놓였을 때 비로소 진정한 절의가 나타난다. 평소에는 간과 쓸개를 서로 보여주며(간담상조) 배신하지 않을 것처럼 맹세하지만, 막상 이해관계가 엇갈리거나 위기가 닥치면 모른 척한다'라며 세태를 비판함. 반면 유종원은 친구 유우석이 귀양을 가게 되자, 그의 늙은 어머니를 걱정하여 자신의 부임지와 바꿔달라고 황제에게 간청할 정도로 의리가 깊었음. 간담상조는 바로 이런 유종원의 숭고한 우정을 기리기 위해 사용된 말임. 진정한 친구 관계를 묘사할 때 최고의 찬사로 쓰임."
            },
            {
                name: "결자해지",
                hanja: "結者解之",
                meaning: "매듭을 묶은 자가 풀어야 한다는 뜻, 일을 벌인 사람이 해결해야 함",
                origin: "어떤 일을 처음 시작하거나 문제를 일으킨 사람이 그 일의 끝맺음이나 문제 해결도 책임져야 함을 의미함. 조선 시대의 학자 홍만종이 엮은 순오지에 등장하는 불교계의 격언에서 유래한 것으로 알려져 있음. 살아가다 보면 의도치 않게 타인에게 피해를 주거나 갈등을 유발하는 상황이 발생하기 마련임. 이때 상황을 회피하거나 남에게 책임을 떠넘기지 않고, 원인 제공자가 스스로 나서서 사태를 수습하는 것이 마땅한 도리임을 강조함. 정치, 경제, 일상생활 등 모든 분야에서 책임감 있는 자세를 요구할 때 빈번하게 사용됨. 스스로 저지른 일에 대해 책임을 지는 성숙한 태도야말로 신뢰받는 인간관계의 기본임을 일깨워줌."
            },
            {
                name: "결초보은",
                hanja: "結草報恩",
                meaning: "죽어서도 잊지 않고 은혜를 갚음",
                origin: "춘추시대 진나라에 위무자라는 사람이 있었는데, 병이 들자 아들 위과에게 자신이 죽으면 젊은 첩(서모)을 순장하라고 유언함. 그러나 위무자가 죽자, 위과는 아버지가 정신이 혼미할 때 하신 말씀이라며 서모를 다른 곳으로 시집보내 살려줌. 훗날 위과가 전쟁터에서 적장 두회에게 쫓겨 목숨이 위태로운 상황에 처함. 그때 위과의 눈앞에 한 노인이 나타나 무성한 풀들을 묶어 놓았고, 말을 타고 쫓아오던 두회가 그 풀에 걸려 넘어지면서 위과는 목숨을 구하고 적장을 사로잡음. 그날 밤 위과의 꿈에 그 노인이 나타나 '나는 네가 시집보내 준 여인의 아버지다. 네가 내 딸을 살려준 은혜를 갚은 것이다'라고 말함. 이 아름다운 고사는 선행은 반드시 보답을 받는다는 깊은 감동을 주는 이야기임."
            },
            {
                name: "경국지색",
                hanja: "傾國之色",
                meaning: "나라를 기울어지게 할 만큼 빼어난 미인",
                origin: "한나라 무제 때 음악에 조예가 깊은 이연년이 지은 시에서 유래함. 그는 무제 앞에서 춤을 추며 '북방에 아름다운 사람이 있으니, 세상에 둘도 없이 홀로 서 있네. 한 번 돌아보면 성을 기울게 하고, 두 번 돌아보면 나라를 기울게 하네'라는 노래를 부름. 무제가 그런 미인이 정말 있느냐고 묻자, 무제의 누이인 평양공주가 이연년의 여동생을 추천함. 무제는 그녀를 보고 첫눈에 반해 총애하게 되었고, 이 여인이 바로 훗날의 이부인임. 이후 절세미인을 가리키는 말로 굳어짐. 하지만 역사적으로 은나라 달기나 주나라 포사처럼 미색에 빠진 군주가 정사를 돌보지 않아 나라가 멸망에 이른 사례를 경계하는 의미도 함께 담고 있음."
            },
            {
                name: "계란유골",
                hanja: "鷄卵有骨",
                meaning: "달걀에도 뼈가 있다, 운수 나쁜 사람의 일은 늘 꼬임",
                origin: "조선 세종 때의 명재상 황희 정승의 일화에서 유래한 말임. 황희가 영의정으로 있을 때 집안이 매우 가난하여 반찬도 없이 밥을 먹는 경우가 많았음. 이를 안타깝게 여긴 세종대왕이 하루는 남대문으로 들어오는 모든 물건을 황희에게 주라는 어명을 내림. 그러나 마침 그날 하루 종일 폭우가 쏟아져 성안으로 들어오는 장사꾼이 단 한 명도 없었음. 저녁때가 되어서야 시골 영감이 달걀 한 꾸러미를 들고 들어와 그것을 황희에게 하사함. 황희가 기뻐하며 달걀을 삶아 먹으려 했으나, 껍질을 까보니 달걀이 모두 곯아 있어서(골병들다) 단 한 개도 먹지 못함. 백성들 사이에서 '달걀이 곯았다'는 말이 한자어 발음의 유사성 때문에 '뼈가 있다(유골)'는 말로 와전됨. 운수가 나쁜 사람은 모처럼 좋은 기회를 만나도 뜻대로 되지 않음을 한탄할 때 쓰는 표현임."
            },
            {
                name: "계륵",

                origin: "남송의 위대한 학자 진량이 친구인 주희에게 보낸 편지에서 유래한 통찰력 있는 성어임. 문자 그대로 같은 침상에 나란히 누워 자면서도 서로 전혀 다른 내용의 꿈을 꾼다는 뜻임. 겉으로는 같이 평화롭게 행동하며 한마음 한뜻인 것처럼 보이지만, 그 이면을 들여다보면 속으로는 각자 자신의 이익만을 계산하거나 완전히 다른 꿍꿍이를 품고 있는 기회주의적인 상황을 꼬집을 때 쓰임. 정치적 목적을 위해 억지로 결성된 연합이나, 이념이 다른 집단이 잠시 뭉쳤을 때 나타나는 아슬아슬한 관계를 묘사하는 데 탁월한 표현임."
            },
            {
                name: "동병상련",
                origin: "중국 역사서 '오월춘추'에 기록된 고사로, 상처받은 사람들끼리의 깊은 공감대를 나타내는 따뜻한 성어임. 초나라에서 억울하게 아버지를 잃고 복수를 다짐하며 오나라로 도망친 오자서가, 역시 초나라에서 쫓겨 도망쳐 온 백비를 적극적으로 도와줌. 사람들이 왜 그토록 정성껏 남을 돕는지 묻자, 오자서는 '같은 병을 앓는 환자끼리 서로 가엾게 여기듯, 나와 똑같이 억울한 처지의 백비를 돕는 것은 너무나 당연하다'고 답함. 어려운 처지나 불행한 환경에 놓인 사람끼리 서로의 아픔을 깊이 이해하고 동정하며 돕는 인지상정을 의미함."
            }
        ];

        // 업데이트할 데이터가 있으면 기존 데이터에 덮어쓰기
        detailedUpdates.forEach(updateItem => {
            const index = idiomsData.findIndex(item => item.name === updateItem.name);
            if (index !== -1) {
                idiomsData[index].origin = updateItem.origin;
            }
        });

        // 가나다순으로 전체 정렬
        idiomsData.sort((a, b) => a.name.localeCompare(b.name));

        // 자음 추출 헬퍼 함수
        function getChosung(str) {
            const cho = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
            const code = str.charCodeAt(0) - 44032;
            if (code > -1 && code < 11172) return cho[Math.floor(code / 588)];
            return str.charAt(0);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const navContainer = document.getElementById('index-nav');
            const contentContainer = document.getElementById('content-area');
            
            // 사용된 자음들만 추출하여 목차 생성
            const usedChosungs = [...new Set(idiomsData.map(item => getChosung(item.name)))];
            
            usedChosungs.forEach(cho => {
                // 네비게이션 버튼 생성
                const btn = document.createElement('button');
                btn.className = 'nav-item px-4 py-2 text-left rounded-md transition-colors text-[#7A6F5D] hover:bg-[#D4C9B3] whitespace-nowrap md:whitespace-normal font-medium';
                btn.textContent = cho;
                btn.onclick = () => {
                    document.getElementById(`section-${cho}`).scrollIntoView({ behavior: 'smooth', block: 'start' });
                    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                navContainer.appendChild(btn);

                // 컨텐츠 섹션 생성
                const section = document.createElement('div');
                section.id = `section-${cho}`;
                section.className = 'scroll-mt-40 md:scroll-mt-12'; // 모바일 헤더 고려
                
                const sectionTitle = document.createElement('h2');
                sectionTitle.className = 'text-3xl font-bold mb-6 text-[#8C7A5E] border-b-2 border-[#8C7A5E] pb-2 inline-block';
                sectionTitle.textContent = cho;
                section.appendChild(sectionTitle);

                const list = document.createElement('div');
                list.className = 'space-y-6';

                // 해당 자음의 데이터 필터링 및 렌더링
                const sectionData = idiomsData.filter(item => getChosung(item.name) === cho);
                
                sectionData.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'bg-white p-6 rounded-xl shadow-sm border border-[#EFE9DB] hover:shadow-md transition-shadow';
                    
                    // 글자별 뱃지 HTML 생성
                    const hanjaChars = item.hanja.split('');
                    const badgesHTML = hanjaChars.map(char => 
                        `<span class="inline-flex items-center justify-center w-8 h-8 md:w-10 md:h-10 rounded bg-[#F9F7F1] border border-[#D4C9B3] text-[#4A4133] hanja-text text-lg md:text-xl shadow-sm">${char}</span>`
                    ).join('<span class="mx-1 text-[#D4C9B3]">-</span>');

                    // 유래가 있는 경우에만 영역 표시
                    let originHTML = '';
                    if (item.origin && item.origin.trim().length > 0) {
                        originHTML = `
                        <div class="prose-text text-[#5C5549] leading-relaxed text-sm md:text-base mt-4 pt-4 border-t border-dashed border-[#D4C9B3]">
                            <span class="font-semibold text-[#8C7A5E] block mb-1">📖 유래 및 해설:</span> 
                            ${item.origin}
                        </div>`;
                    }
                    
                    card.innerHTML = `
                        <div class="flex flex-col xl:flex-row xl:items-center gap-3 mb-4">
                            <h3 class="text-2xl font-bold text-[#2D2A26] min-w-fit">${item.name}</h3>
                            <div class="flex items-center flex-wrap gap-y-2">${badgesHTML}</div>
                        </div>
                        <div class="text-lg font-medium text-[#4A4133] bg-[#F9F7F1] p-3 rounded border-l-4 border-[#8C7A5E]">
                            "${item.meaning}"
                        </div>
                        ${originHTML}
                    `;
                    list.appendChild(card);
                });

                section.appendChild(list);
                contentContainer.appendChild(section);
            });

            // 첫 번째 목차 활성화 (텍스트 노드 오류를 방지하기 위해 querySelector 사용)
            const firstNavItem = navContainer.querySelector('.nav-item');
            if (firstNavItem) {
                firstNavItem.classList.add('active');
            }

            // 스크롤 시 목차 하이라이트 변경 로직
            const sections = document.querySelectorAll('[id^="section-"]');
            const navItems = document.querySelectorAll('.nav-item');
            
            contentContainer.parentElement.addEventListener('scroll', () => {
                let current = '';
                sections.forEach(section => {
                    const sectionTop = section.offsetTop;
                    // 부모 스크롤 컨테이너 기준으로 위치 계산
                    if (contentContainer.parentElement.scrollTop >= sectionTop - 150) {
                        current = section.getAttribute('id').replace('section-', '');
                    }
                });

                navItems.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.textContent === current) {
                        btn.classList.add('active');
                        // 모바일 화면에서 목차가 활성화된 쪽으로 자동 스크롤
                        if(window.innerWidth < 768) {
                           btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                        }
                    }
                });
            });
            
            // 게임 초기화
            initGame();
        });

        function switchTab(tabId) {
            const dicView = document.getElementById('dictionary-view');
            const gameView = document.getElementById('game-view');
            const tabDic = document.getElementById('tab-dictionary');
            const tabGame = document.getElementById('tab-game');

            if (tabId === 'dictionary') {
                dicView.classList.remove('hidden');
                dicView.classList.add('flex');
                gameView.classList.add('hidden');
                gameView.classList.remove('flex');
                
                tabDic.classList.replace('border-transparent', 'border-[#D4C9B3]');
                tabDic.classList.remove('opacity-60');
                tabGame.classList.replace('border-[#D4C9B3]', 'border-transparent');
                tabGame.classList.add('opacity-60');
            } else {
                gameView.classList.remove('hidden');
                gameView.classList.add('flex');
                dicView.classList.add('hidden');
                dicView.classList.remove('flex');

                tabGame.classList.replace('border-transparent', 'border-[#D4C9B3]');
                tabGame.classList.remove('opacity-60');
                tabDic.classList.replace('border-[#D4C9B3]', 'border-transparent');
                tabDic.classList.add('opacity-60');
            }
        }

        // 각 세트마다 완벽하게 교차(가로 6개, 세로 6개)되는 좌표 하드코딩
        const gameSets = [
            [ // 세트 1
                { word: "고진감래", type: "가로", row: 1, col: 1 },
                { word: "고립무원", type: "세로", row: 1, col: 1 },
                { word: "무위도식", type: "가로", row: 3, col: 1 },
                { word: "도원결의", type: "세로", row: 3, col: 3 },
                { word: "사면초가", type: "가로", row: 1, col: 7 },
                { word: "사상누각", type: "세로", row: 1, col: 7 },
                { word: "누란지위", type: "가로", row: 3, col: 7 },
                { word: "지록위마", type: "세로", row: 3, col: 9 },
                { word: "백발백중", type: "가로", row: 7, col: 1 },
                { word: "백년가약", type: "세로", row: 7, col: 1 },
                { word: "가인박명", type: "가로", row: 9, col: 1 },
                { word: "박장대소", type: "세로", row: 9, col: 3 }
            ],
            [ // 세트 2
                { word: "일석이조", type: "가로", row: 1, col: 1 },
                { word: "일파만파", type: "세로", row: 1, col: 1 },
                { word: "만고천추", type: "가로", row: 3, col: 1 },
                { word: "천재일우", type: "세로", row: 3, col: 3 },
                { word: "안하무인", type: "가로", row: 1, col: 7 },
                { word: "안분지족", type: "세로", row: 1, col: 7 },
                { word: "지란지교", type: "가로", row: 3, col: 7 },
                { word: "지성감천", type: "세로", row: 3, col: 9 },
                { word: "천고마비", type: "가로", row: 7, col: 1 },
                { word: "천군만마", type: "세로", row: 7, col: 1 },
                { word: "만시지탄", type: "가로", row: 9, col: 1 },
                { word: "지행합일", type: "세로", row: 9, col: 3 }
            ],
            [ // 세트 3
                { word: "유비무환", type: "가로", row: 1, col: 1 },
                { word: "유명무실", type: "세로", row: 1, col: 1 },
                { word: "무지몽매", type: "가로", row: 3, col: 1 },
                { word: "몽중설몽", type: "세로", row: 3, col: 3 },
                { word: "기고만장", type: "가로", row: 1, col: 7 },
                { word: "기사회생", type: "세로", row: 1, col: 7 },
                { word: "회자정리", type: "가로", row: 3, col: 7 },
                { word: "정문일침", type: "세로", row: 3, col: 9 },
                { word: "우공이산", type: "가로", row: 7, col: 1 },
                { word: "우왕좌왕", type: "세로", row: 7, col: 1 },
                { word: "좌고우면", type: "가로", row: 9, col: 1 },
                { word: "우문현답", type: "세로", row: 9, col: 3 }
            ],
            [ // 세트 4
                { word: "전전긍긍", type: "가로", row: 1, col: 1 },
                { word: "전전반측", type: "세로", row: 1, col: 1 },
                { word: "반신반의", type: "가로", row: 3, col: 1 },
                { word: "반목질시", type: "세로", row: 3, col: 3 },
                { word: "호가호위", type: "가로", row: 1, col: 7 },
                { word: "호시탐탐", type: "세로", row: 1, col: 7 },
                { word: "탐관오리", type: "가로", row: 3, col: 7 },
                { word: "오리무중", type: "세로", row: 3, col: 9 },
                { word: "구사일생", type: "가로", row: 7, col: 1 },
                { word: "구밀복검", type: "세로", row: 7, col: 1 },
                { word: "복수불반", type: "가로", row: 9, col: 1 },
                { word: "불철주야", type: "세로", row: 9, col: 3 }
            ],
            [ // 세트 5
                { word: "일사불란", type: "가로", row: 1, col: 1 },
                { word: "일망타진", type: "세로", row: 1, col: 1 },
                { word: "타산지석", type: "가로", row: 3, col: 1 },
                { word: "지기지우", type: "세로", row: 3, col: 3 },
                { word: "자가당착", type: "가로", row: 1, col: 7 },
                { word: "자격지심", type: "세로", row: 1, col: 7 },
                { word: "지성감천", type: "가로", row: 3, col: 7 },
                { word: "감언이설", type: "세로", row: 3, col: 9 },
                { word: "유유상종", type: "가로", row: 7, col: 1 },
                { word: "유유자적", type: "세로", row: 7, col: 1 },
                { word: "자승자박", type: "가로", row: 9, col: 1 },
                { word: "자업자득", type: "세로", row: 9, col: 3 }
            ]
        ];

        let currentSetIndex = 0;
        let gridState = []; // 정답 비교용
        
        function initGame() {
            // 세트 선택 버튼 생성
            const selectorContainer = document.getElementById('game-set-selector');
            selectorContainer.innerHTML = '';
            for(let i = 0; i < gameSets.length; i++) {
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-full font-bold text-sm transition-colors ${i === currentSetIndex ? 'bg-[#8C7A5E] text-white' : 'bg-[#EFE9DB] text-[#7A6F5D] hover:bg-[#D4C9B3]'}`;
                btn.innerText = `세트 ${i + 1}`;
                btn.onclick = () => loadGameSet(i);
                selectorContainer.appendChild(btn);
            }
            
            loadGameSet(currentSetIndex);
        }

        function loadGameSet(index) {
            currentSetIndex = index;
            // 버튼 스타일 업데이트
            const buttons = document.getElementById('game-set-selector').children;
            for(let i = 0; i < buttons.length; i++) {
                if(i === index) {
                    buttons[i].className = 'px-4 py-2 rounded-full font-bold text-sm transition-colors bg-[#8C7A5E] text-white';
                } else {
                    buttons[i].className = 'px-4 py-2 rounded-full font-bold text-sm transition-colors bg-[#EFE9DB] text-[#7A6F5D] hover:bg-[#D4C9B3]';
                }
            }

            const currentSetData = gameSets[index];
            gridState = Array(14).fill(null).map(() => Array(14).fill(null));
            
            // 번호 매기기 로직 (좌상단에서 우하단 순)
            let currentNum = 1;
            const startPositions = {};
            
            // 좌표별 정렬
            const sortedWords = [...currentSetData].sort((a, b) => {
                if (a.row === b.row) return a.col - b.col;
                return a.row - b.row;
            });

            sortedWords.forEach(w => {
                const key = `${w.row}-${w.col}`;
                if (!startPositions[key]) {
                    startPositions[key] = currentNum++;
                }
                w.num = startPositions[key];

                // 그리드 데이터 채우기
                for(let i=0; i<4; i++) {
                    let r = w.type === '가로' ? w.row : w.row + i;
                    let c = w.type === '가로' ? w.col + i : w.col;
                    
                    if (!gridState[r][c]) {
                        gridState[r][c] = { letter: w.word[i], startNums: [], words: [] };
                    }
                    if (i === 0) {
                        gridState[r][c].startNums.push(w.num);
                    }
                    gridState[r][c].words.push(w.word);
                }
            });

            renderGrid();
            renderClues(sortedWords);
        }

        function renderGrid() {
            const gridContainer = document.getElementById('crossword-grid');
            gridContainer.innerHTML = '';
            gridContainer.className = "grid gap-0 border-t border-l border-[#8C7A5E] bg-[#F9F7F1]";
            gridContainer.style.gridTemplateColumns = "repeat(14, minmax(0, 1fr))";

            for(let r = 0; r < 14; r++) {
                for(let c = 0; c < 14; c++) {
                    const cellData = gridState[r][c];
                    const cellWrapper = document.createElement('div');
                    cellWrapper.className = "relative aspect-square border-r border-b border-[#8C7A5E]";
                    
                    if (cellData) {
                        cellWrapper.classList.add('bg-white');
                        
                        // 입력칸
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.maxLength = 1;
                        input.id = `cell-${r}-${c}`;
                        input.className = "w-full h-full text-center text-lg md:text-2xl font-bold text-[#2D2A26] hanja-text outline-none bg-transparent uppercase focus:bg-[#FFFDF7] focus:ring-inset focus:ring-2 focus:ring-[#8C7A5E]";
                        input.dataset.answer = cellData.letter;
                        
                        // 키보드 이동 편의성 (글자 입력 시 다음칸으로)
                        input.addEventListener('input', function() {
                            this.classList.remove('text-red-500', 'bg-red-50', 'text-green-600', 'bg-green-50');
                        });

                        cellWrapper.appendChild(input);

                        // 힌트 번호 표시
                        if (cellData.startNums.length > 0) {
                            const numSpan = document.createElement('span');
                            numSpan.className = "absolute top-0.5 left-1 text-[10px] md:text-xs font-bold text-[#7A6F5D]";
                            numSpan.innerText = cellData.startNums.join(',');
                            cellWrapper.appendChild(numSpan);
                        }
                    } else {
                        // 빈 공간 (사용하지 않는 영역)
                        cellWrapper.className = "aspect-square border-r border-b border-[#D4C9B3] bg-transparent";
                    }
                    
                    gridContainer.appendChild(cellWrapper);
                }
            }
        }

        function renderClues(sortedWords) {
            const listAcross = document.getElementById('clues-across');
            const listDown = document.getElementById('clues-down');
            listAcross.innerHTML = '';
            listDown.innerHTML = '';

            sortedWords.forEach(w => {
                // 사전 데이터에서 의미 가져오기
                const dictionaryEntry = idiomsData.find(item => item.name === w.word);
                const meaning = dictionaryEntry ? dictionaryEntry.meaning : "의미 정보가 없습니다.";

                const li = document.createElement('li');
                li.innerHTML = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-[#EFE9DB] text-[#4A4133] font-bold text-xs mr-2">${w.num}</span> 
                                <span class="font-medium">${meaning}</span>`;
                
                if (w.type === '가로') {
                    listAcross.appendChild(li);
                } else {
                    listDown.appendChild(li);
                }
            });
        }

        function checkAnswers() {
            for(let r = 0; r < 14; r++) {
                for(let c = 0; c < 14; c++) {
                    const cellData = gridState[r][c];
                    if (cellData) {
                        const input = document.getElementById(`cell-${r}-${c}`);
                        const userVal = input.value.trim();
                        
                        input.classList.remove('text-red-500', 'bg-red-50', 'text-green-600', 'bg-green-50');
                        
                        if (userVal === '') continue; // 빈 칸은 무시
                        
                        if (userVal === cellData.letter) {
                            input.classList.add('text-green-600', 'bg-green-50');
                        } else {
                            input.classList.add('text-red-500', 'bg-red-50');
                        }
                    }
                }
            }
        }

        function showAnswers() {
            if(confirm("모든 정답을 확인하시겠습니까?")) {
                for(let r = 0; r < 14; r++) {
                    for(let c = 0; c < 14; c++) {
                        const cellData = gridState[r][c];
                        if (cellData) {
                            const input = document.getElementById(`cell-${r}-${c}`);
                            input.value = cellData.letter;
                            input.classList.remove('text-red-500', 'bg-red-50');
                            input.classList.add('text-green-600', 'bg-green-50');
                        }
                    }
                }
            }
        }
    </script>
