        function getTodayString() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function changeSelectedDate(newDate) {
            state.selectedDate = newDate;
            renderContent();
        }

        function getWeekRange(dateStr) {
            const d = new Date(dateStr);
            const day = d.getDay();
            const diffToMonday = d.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(d);
            monday.setDate(diffToMonday);
            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);
            return { start: monday, end: sunday };
        }

        function isSameWeek(dateStr1, dateStr2) {
            const range1 = getWeekRange(dateStr1);
            const range2 = getWeekRange(dateStr2);
            return range1.start.getTime() === range2.start.getTime();
        }

        function formatDateShort(dateString) {
            const d = new Date(dateString);
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}(${days[d.getDay()]})`;
        }

        function getWeekDisplayStr(dateStr) {
            const range = getWeekRange(dateStr);
            const friday = new Date(range.start);
            friday.setDate(range.start.getDate() + 4);
            const format = (date) => `${date.getMonth() + 1}월 ${date.getDate()}일`;
            return `${format(range.start)} ~ ${format(friday)}`;
        }

                                    <th class="px-3 py-3 text-center font-bold border-r border-gray-300 w-20">학반</th>
                                    <th class="px-3 py-3 text-center font-bold border-r border-gray-300 w-20">교시</th>
                                    <th class="px-4 py-3 text-center font-bold border-r border-gray-300 w-32">중복 교사</th>
                                    <th class="px-4 py-3 text-center font-bold border-r border-gray-300">비고</th>
                                    <th class="px-3 py-3 text-center font-bold border-r border-gray-300 w-20 text-red-600">삭제</th>
                                    <th class="px-4 py-3 text-center font-bold border-r border-gray-300 bg-yellow-100 w-40">이동할 교실</th>
                                    <th class="px-3 py-3 text-center font-bold border-r border-gray-300 bg-yellow-100 w-24">학생 안내</th>
                                    <th class="px-3 py-3 text-center font-bold w-20 bg-yellow-100 text-blue-600">확인</th>
                                </tr>
                            </thead>
                            <tbody id="overlap-table-body" class="bg-white divide-y divide-gray-200">
                                <!-- Records will be injected here -->
                            </tbody>
                        </table>
                        <div id="overlap-empty-msg" class="text-center p-8 text-gray-500 font-medium hidden">해당 주간에 등록된 중복 현황이 없습니다. 위에서 추가해 주세요.</div>
                    </div>
                </div>
                ${getNoticeHTML()}
            `;
            container.innerHTML = html;
            renderOverlapTableBody();
        }

        function addOverlapRecord() {
            const name = document.getElementById('overlap-name-input').value.trim();
            const gradeClass = document.getElementById('overlap-class-input').value.trim();
            const period = document.getElementById('overlap-period-input').value.trim();
            const dup = document.getElementById('overlap-dup-input').value.trim();
            const note = document.getElementById('overlap-note-input').value.trim();

            if (!name) {
                alert('시간 이동 교사 이름을 입력해주세요.');
                return;
            }

            const newRecord = {
                id: Date.now(),
                date: state.selectedDate, // 선택된 날짜 자동 저장
                name: name,
                gradeClass: gradeClass,
                period: period,
                dupTeacher: dup,
                note: note,
                moveRoom: '',
                studentNotice: false, // 텍스트에서 체크박스용 boolean(참/거짓)으로 변경
                saved: false
            };

            overlapRecords.push(newRecord);
            renderOverlapTableBody();

            // Clear inputs
            clearOverlapInputs();
        }

        function clearOverlapInputs() {
            document.getElementById('overlap-name-input').value = '';
            document.getElementById('overlap-class-input').value = '';
            document.getElementById('overlap-period-input').value = '';
            document.getElementById('overlap-dup-input').value = '';
            document.getElementById('overlap-note-input').value = '';
        }

        function deleteOverlapRecord(id) {
            overlapRecords = overlapRecords.filter(r => r.id !== id);
            renderContent();
        }

        function saveMoveInfo(id) {
            const roomInput = document.getElementById(`move-room-${id}`).value;
            const noticeInput = document.getElementById(`move-notice-${id}`).checked; // 텍스트 value 대신 체크 여부(checked) 확인
            
            const record = overlapRecords.find(r => r.id === id);
            if(record) {
                record.moveRoom = roomInput;
                record.studentNotice = noticeInput;
                record.saved = true;
            }
            renderOverlapTableBody();
        }

        function editMoveInfo(id) {
            const record = overlapRecords.find(r => r.id === id);
            if(record) {
                record.saved = false;
            }
            renderOverlapTableBody();
        }

        function renderOverlapTableBody() {
            const tbody = document.getElementById('overlap-table-body');
            const emptyMsg = document.getElementById('overlap-empty-msg');
            if(!tbody) return;
            
            tbody.innerHTML = '';
            
            // 필터링: 선택된 날짜와 같은 주간(월~일)에 있는 기록들만 가져옴
            const weeklyRecords = overlapRecords.filter(r => isSameWeek(r.date, state.selectedDate));
            
            // 정렬: 1순위 날짜순, 2순위 먼저 입력한 순
            weeklyRecords.sort((a, b) => new Date(a.date) - new Date(b.date) || a.id - b.id);

            if (weeklyRecords.length === 0) {
                if(emptyMsg) emptyMsg.classList.remove('hidden');
            } else {
                if(emptyMsg) emptyMsg.classList.add('hidden');
            }

            weeklyRecords.forEach(record => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition-colors";
                
                let moveRoomCell = '';
                let noticeCell = '';
                let actionBtn = '';

                if (record.saved) {
                    moveRoomCell = `<td class="px-4 py-2 text-center font-bold text-blue-700 bg-yellow-50 border-r border-gray-200">${record.moveRoom || '-'}</td>`;
                    noticeCell = `<td class="px-2 py-2 text-center bg-yellow-50 border-r border-gray-200">
                        ${record.studentNotice ? '<span class="text-green-600 font-bold text-sm">완료✅</span>' : '<span class="text-gray-400 font-medium text-sm">미완료</span>'}
                    </td>`;
                    actionBtn = `<td class="px-2 py-2 text-center bg-yellow-50"><button onclick="editMoveInfo(${record.id})" class="text-blue-600 hover:text-blue-800 font-bold px-2 py-1 bg-blue-100 rounded text-sm transition-colors w-full">수정</button></td>`;
                } else {
                    moveRoomCell = `<td class="px-2 py-2 text-center bg-yellow-50 border-r border-gray-200"><input type="text" id="move-room-${record.id}" value="${record.moveRoom}" placeholder="교실 입력" class="border border-gray-300 rounded p-1 w-full text-center focus:border-primary text-sm"></td>`;
                    noticeCell = `<td class="px-2 py-2 text-center bg-yellow-50 border-r border-gray-200">
                        <input type="checkbox" id="move-notice-${record.id}" ${record.studentNotice ? 'checked' : ''} class="w-5 h-5 cursor-pointer accent-blue-600 align-middle hover:scale-110 transition-transform">
                    </td>`;
                    actionBtn = `<td class="px-2 py-2 text-center bg-yellow-50"><button onclick="saveMoveInfo(${record.id})" class="text-green-700 hover:text-green-900 font-bold px-2 py-1 bg-green-200 rounded text-sm transition-colors w-full">저장</button></td>`;
                }

                tr.innerHTML = `
                    <td class="px-3 py-3 text-center border-r border-gray-200 bg-gray-50"><span class="text-sm font-bold text-gray-600">${formatDateShort(record.date)}</span></td>
                    <td class="px-4 py-3 text-center font-medium border-r border-gray-200">${record.name}</td>
                    <td class="px-3 py-3 text-center border-r border-gray-200">${record.gradeClass || ''}</td>
                    <td class="px-3 py-3 text-center border-r border-gray-200">${record.period}</td>
                    <td class="px-4 py-3 text-center border-r border-gray-200">${record.dupTeacher}</td>
                    <td class="px-4 py-3 text-center border-r border-gray-200">${record.note}</td>
                    <td class="px-2 py-3 text-center border-r border-gray-200">
                        <button onclick="deleteOverlapRecord(${record.id})" class="text-red-500 hover:text-white hover:bg-red-500 font-bold px-2 py-1 border border-red-300 rounded text-sm transition-colors w-full">삭제</button>
                    </td>
                    ${moveRoomCell}
                    ${noticeCell}
                    ${actionBtn}
                `;
                tbody.appendChild(tr);
            });
        }

        function compareRooms(a, b) {
            const parse = (r) => {
                let match = r.match(/^(\d+)-(\d+)$/);
                if (match) return [parseInt(match[1]), parseInt(match[2])];
                return [99, r];
            };
            const [g1, r1] = parse(a.room);
            const [g2, r2] = parse(b.room);
            if (g1 !== g2) return g1 - g2;
            if (typeof r1 === 'number' && typeof r2 === 'number') return r1 - r2;
            return a.room.localeCompare(b.room);
        }

        function renderAssignmentTab(container) {
            let sortedData = [...assignmentData];
            if (state.subTab === 'teacher') {
                sortedData.sort((a, b) => a.name.localeCompare(b.name));
            } else {
                sortedData.sort(compareRooms);
            }

            let html = `
                <div class="p-6 flex-grow flex flex-col w-full items-center">
                    <!-- 서브 탭 (가운데 정렬) -->
                    <div class="flex justify-center space-x-4 mb-6 w-full max-w-7xl">
                        <button id="subtab-room" onclick="setSubTab('room')" class="sub-tab-btn px-8 py-2.5 rounded-full font-bold text-lg transition-all shadow-sm border-2">교실별</button>
                        <button id="subtab-teacher" onclick="setSubTab('teacher')" class="sub-tab-btn px-8 py-2.5 rounded-full font-bold text-lg transition-all shadow-sm border-2">교사별</button>
                    </div>

                    <!-- 표 영역 -->
                    <div class="w-full max-w-7xl">
                        <div class="overflow-x-auto rounded-xl border border-gray-300 shadow-sm w-full">
                            <table class="text-base text-gray-700 min-w-max w-full">
                                <thead class="text-sm bg-gray-200 text-gray-800 border-b-2 border-gray-400">
                                    <tr>
            `;
            
            if (state.subTab === 'room') {
                html += `
                                        <th class="px-4 py-3 text-center font-bold whitespace-nowrap border-r border-gray-300 w-32">배정 교실</th>
                                        <th class="px-4 py-3 text-center font-bold whitespace-nowrap border-r border-gray-300 w-32">이름</th>
                                        <th class="px-4 py-3 text-center font-bold whitespace-nowrap border-r border-gray-300 w-40">교과</th>
                                        <th class="px-6 py-3 text-center font-bold whitespace-nowrap">공동 사용자</th>
                `;
            } else { // 교사별 탭 열 순서: 이름, 배정 교실, 교과, 공동 사용자 (모두 가운데 정렬)
                html += `
                                        <th class="px-4 py-3 text-center font-bold whitespace-nowrap border-r border-gray-300 w-32">이름</th>
                                        <th class="px-4 py-3 text-center font-bold whitespace-nowrap border-r border-gray-300 w-32">배정 교실</th>
                                        <th class="px-4 py-3 text-center font-bold whitespace-nowrap border-r border-gray-300 w-40">교과</th>
                                        <th class="px-6 py-3 text-center font-bold whitespace-nowrap">공동 사용자</th>
                `;
            }

            html += `
                                    </tr>
                                </thead>
                                <tbody>
            `;
            
            let prevGroupVal = null;
            let bgClass = "bg-white";
            let altColors = ["bg-white", "bg-green-50"];
            let colorIndex = 0;

            sortedData.forEach((row, index) => {
                let currentGroupVal = state.subTab === 'room' ? row.room : row.name;
                if (index === 0) prevGroupVal = currentGroupVal;
                else if (currentGroupVal !== prevGroupVal) {
                    colorIndex = (colorIndex + 1) % 2;
                    bgClass = altColors[colorIndex];
                    prevGroupVal = currentGroupVal;
                }

                html += `
                    <tr class="${bgClass} border-b border-gray-200 hover:bg-yellow-50 transition-colors">
                `;
                
                // All text-center applied
                if (state.subTab === 'room') {
                    html += `
                        <td class="px-4 py-3 text-center font-bold whitespace-nowrap border-r border-gray-200">${row.room}</td>
                        <td class="px-4 py-3 text-center font-medium whitespace-nowrap border-r border-gray-200">${row.name}</td>
                        <td class="px-4 py-3 text-center whitespace-nowrap border-r border-gray-200">${row.subject}</td>
                        <td class="px-6 py-3 text-center whitespace-nowrap">${row.coUser}</td>
                    `;
                } else {
                    html += `
                        <td class="px-4 py-3 text-center font-medium whitespace-nowrap border-r border-gray-200">${row.name}</td>
                        <td class="px-4 py-3 text-center font-bold whitespace-nowrap border-r border-gray-200">${row.room}</td>
                        <td class="px-4 py-3 text-center whitespace-nowrap border-r border-gray-200">${row.subject}</td>
                        <td class="px-6 py-3 text-center whitespace-nowrap">${row.coUser}</td>
                    `;
                }

                html += `
                    </tr>
                `;
            });

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                ${getNoticeHTML()}
            `;
            container.innerHTML = html;
            updateSubTabUI();
        }

        function generateEmptyRoomCell(grade, day, period, data) {
            const rooms = data[period][day];
            if (!rooms || rooms.length === 0) return '-';
            if (rooms[0] === '과제탐구') return '<span class="text-gray-500 font-bold whitespace-nowrap">과제탐구</span>';

            return rooms.map(room => {
                let isPurple = false;
                if (day === '목') {
                    if (grade === '3' && (period === '1교시' || period === '2교시') && ['1','3','7'].includes(room)) isPurple = true;
                    if (grade === '2' && (period === '3교시' || period === '4교시') && ['5','6','8'].includes(room)) isPurple = true;
                }
                return isPurple ? `<span class="text-purple-600 font-bold whitespace-nowrap" title="스포츠(우천 시)">${room}</span>` : `<span class="whitespace-nowrap">${room}</span>`;
            }).join(', ');
        }

        function renderEmptyRoomTab(container) {
            const data = state.subTab === 'grade2' ? emptyRoomDataGrade2 : emptyRoomDataGrade3;
            const gradeNum = state.subTab === 'grade2' ? '2' : '3';
            
            let html = `
                <div class="p-6 flex-grow flex flex-col w-full items-center">
                    <!-- 서브 탭 (가운데 정렬) -->
                    <div class="flex justify-center space-x-4 mb-6 w-full max-w-7xl">
                        <button id="subtab-grade2" onclick="setSubTab('grade2')" class="sub-tab-btn px-8 py-2.5 rounded-full font-bold text-lg transition-all shadow-sm border-2">2학년</button>
                        <button id="subtab-grade3" onclick="setSubTab('grade3')" class="sub-tab-btn px-8 py-2.5 rounded-full font-bold text-lg transition-all shadow-sm border-2">3학년</button>
                    </div>

                    <div class="flex justify-center w-full max-w-7xl">
                        <div class="overflow-x-auto rounded-xl border border-gray-300 shadow-sm w-full max-w-4xl">
                            <table class="w-full text-base text-gray-700 border-collapse">
                                <thead class="bg-gray-200 text-gray-800 border-b-2 border-gray-400">
                                    <tr>
                                        <th class="px-5 py-4 w-20 text-center font-bold text-xl border-r border-gray-300"></th>
                                        <th class="px-6 py-4 text-center font-bold text-xl whitespace-nowrap border-r border-gray-300 w-1/5">월</th>
                                        <th class="px-6 py-4 text-center font-bold text-xl whitespace-nowrap border-r border-gray-300 w-1/5">화</th>
                                        <th class="px-6 py-4 text-center font-bold text-xl whitespace-nowrap border-r border-gray-300 w-1/5">수</th>
                                        <th class="px-6 py-4 text-center font-bold text-xl whitespace-nowrap border-r border-gray-300 w-1/5">목</th>
                                        <th class="px-6 py-4 text-center font-bold text-xl whitespace-nowrap w-1/5">금</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white">
            `;

            ['1교시', '2교시', '3교시', '4교시', '5교시', '6교시', '7교시'].forEach(period => {
                let pNum = period.replace('교시', '');
                html += `<tr class="hover:bg-gray-50 transition-colors border-b border-gray-200 last:border-0">`;
                html += `<td class="px-5 py-4 text-center font-bold text-xl bg-gray-50 whitespace-nowrap border-r border-gray-200">${pNum}</td>`;
                ['월', '화', '수', '목', '금'].forEach((day, idx) => {
                    let borderClass = idx < 4 ? 'border-r border-gray-200' : '';
                    html += `<td class="px-6 py-4 text-center font-medium text-lg whitespace-nowrap ${borderClass}">${generateEmptyRoomCell(gradeNum, day, period, data)}</td>`;
                });
                html += `</tr>`;
            });

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div class="mt-8 bg-gray-50 border border-gray-300 rounded-xl p-5 text-base text-gray-700 shadow-sm flex flex-col md:flex-row gap-4 items-start w-full max-w-4xl">
                        <div class="text-primary font-bold whitespace-nowrap flex items-center">
                            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            참고
                        </div>
                        <ul class="list-disc ml-4 space-y-1">
                            <li>DS 1실과 시청각실(주경미), DS 3실(홍지연), 상상나래실(박혜란)은 관리 담당자와 의논한 후 사용.</li>
                            <li><span class="text-purple-600 font-bold">보라색으로 표시된 학급</span>(목요일 3학년 1~2교시, 2학년 3~4교시)은 우천 시 스포츠 사용, 평소에는 사용 가능.</li>
                        </ul>
                    </div>
                </div>
                ${getNoticeHTML()}
            `;
            container.innerHTML = html;
            updateSubTabUI();
        }
    </script>
</body>
</html>
