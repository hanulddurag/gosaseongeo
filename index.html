        const msgConfirmBtn = document.getElementById('custom-msg-confirm');
        const msgCancelBtn = document.getElementById('custom-msg-cancel');

        function showCustomMsg(msg, isConfirm = false, callback = null) {
            msgText.innerText = msg;
            confirmCallback = callback;
            if(isConfirm) msgCancelBtn.classList.remove('hidden');
            else msgCancelBtn.classList.add('hidden');
            msgModal.classList.remove('hidden');
        }

        msgConfirmBtn.addEventListener('click', () => {
            msgModal.classList.add('hidden');
            if(confirmCallback) confirmCallback(true);
        });

        /* STREAMING_CHUNK:Defining date formatting and notice HTML generation... */
        function formatDate(dateStr) {
            const d = new Date(dateStr);
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}(${days[d.getDay()]})`;
        }

        function getWeekRange(dateStr) {
            const date = new Date(dateStr);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            let startOfWeek = new Date(date.setDate(diff));
            let dates = [];
            for(let i=0; i<5; i++) {
                dates.push((new Date(startOfWeek - (startOfWeek.getTimezoneOffset() * 60000))).toISOString().split('T')[0]);
                startOfWeek.setDate(startOfWeek.getDate() + 1);
            }
            return dates;
        }

        function addOverlapRecord() {
            const name = document.getElementById('overlap-name').value.trim();
            if (!name) return showCustomMsg("시간 이동 교사 이름을 입력해주세요.");
            overlapRecords.push({
                id: Date.now(), date: state.selectedDate, name,
                gradeClass: document.getElementById('overlap-class').value.trim(),
                period: document.getElementById('overlap-period').value.trim(),
                dupTeacher: document.getElementById('overlap-dup').value.trim(),
                note: document.getElementById('overlap-note').value.trim(),
                moveRoom: '', studentNotice: false, saved: false
            });
            saveData(); renderOverlapTableBody(); clearOverlapInputs();
        }

        function deleteOverlapRecord(id) {
            showCustomMsg("해당 행을 삭제하시겠습니까?", true, (conf) => {
                if(conf) { overlapRecords = overlapRecords.filter(r => r.id !== id); saveData(); renderOverlapTableBody(); }
            });
        }

        function saveMoveInfo(id) {
            const r = overlapRecords.find(r => r.id === id);
            if(r) {
                r.moveRoom = document.getElementById(`move-room-${id}`).value;
                r.studentNotice = document.getElementById(`move-notice-${id}`).checked;
                r.saved = true; saveData(); renderOverlapTableBody();
            }
        }

            const r = overlapRecords.find(r => r.id === id);
            if(r) { r.saved = false; saveData(); renderOverlapTableBody(); }

                    ${isSaved 
                        ? `<td class="px-3 py-3 border-l-2 border-yellow-400 bg-yellow-50/50 font-bold text-yellow-900 text-base">${r.moveRoom || '-'}</td>
                           <td class="px-2 py-3 border-l border-yellow-200 bg-yellow-50/50">${r.studentNotice ? '<span class="text-green-700 font-bold bg-green-100 border border-green-200 px-2.5 py-1 rounded-md text-xs shadow-sm">완료 ✅</span>' : '<span class="text-gray-400 text-xs font-medium">미완료</span>'}</td>
                           <td class="px-2 py-3 border-l border-yellow-200 bg-yellow-50/50"><button onclick="editMoveInfo(${r.id})" class="text-xs bg-white hover:bg-gray-100 text-gray-700 px-4 py-1.5 rounded-md font-bold border border-gray-300 w-full transition-colors shadow-sm">수정</button></td>`
                        : `<td class="px-2 py-2 border-l-2 border-yellow-400 bg-yellow-100/50"><input type="text" id="move-room-${r.id}" value="${r.moveRoom}" placeholder="교실 입력" class="w-full bg-white border border-yellow-400 p-1.5 text-center rounded-md text-sm outline-none focus:border-primary focus:ring-1 focus:ring-primary shadow-inner font-bold text-gray-800"></td>
                           <td class="px-2 py-2 border-l border-yellow-300 bg-yellow-100/50"><input type="checkbox" id="move-notice-${r.id}" ${r.studentNotice?'checked':''} class="w-5 h-5 cursor-pointer accent-primary align-middle mt-1 rounded"></td>
                           <td class="px-2 py-2 border-l border-yellow-300 bg-yellow-100/50"><button onclick="saveMoveInfo(${r.id})" class="text-xs bg-primary hover:bg-blue-800 text-white px-4 py-1.5 rounded-md font-bold w-full transition-colors shadow-sm">저장</button></td>`
                    }
                </tr>`;
            }).join('') : `<tr><td colspan="10" class="px-6 py-16 text-center text-gray-400 font-medium bg-gray-50/30">선택한 주간에 등록된 현황이 없습니다.</td></tr>`;
        }

        /* STREAMING_CHUNK:Implementing admin and Excel file upload functions... */
        function toggleAdminModal() { document.getElementById('admin-modal').classList.toggle('hidden'); }
        
        function downloadData(type) {
            const wb = XLSX.utils.book_new();
            let ws;
            let fileName = '';

            if (type === 'assignment') {
                const data = assignmentData.map(d => ({
                    '배정 교실': d.room || '',
                    '이름': d.name || '',
                    '교과': d.subject || '',
                    '공동 사용자': d.coUser || ''
                }));
                ws = XLSX.utils.json_to_sheet(data);
                fileName = '교실배정현황.xlsx';
            } else {
                const dataObj = type === 'empty2' ? emptyRoomDataGrade2 : emptyRoomDataGrade3;
                const data = [];
                const periods = ['1교시', '2교시', '3교시', '4교시', '5교시', '6교시', '7교시'];
                const days = ['월', '화', '수', '목', '금'];
                
                periods.forEach(p => {
                    let row = { '교시': p };
                    days.forEach(d => {
                        row[d] = (dataObj[p] && dataObj[p][d]) ? dataObj[p][d].join(', ') : '';
                    });
                    data.push(row);
                });
                ws = XLSX.utils.json_to_sheet(data);
                fileName = type === 'empty2' ? '공강교실현황_2학년.xlsx' : '공강교실현황_3학년.xlsx';
            }

            XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
            XLSX.writeFile(wb, fileName);
        }

        function handleFileUpload(e, type) {
            const file = e.target.files[0]; 
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, {defval: ""});

                    if (type === 'assignment') {
                        assignmentData = json.map(row => ({
                            room: String(row['배정 교실'] || '').trim(),
                            name: String(row['이름'] || '').trim(),
                            subject: String(row['교과'] || '').trim(),
                            coUser: String(row['공동 사용자'] || '').trim()
                        }));
                    } else {
                        const parsedData = {};
                        const periods = ['1교시', '2교시', '3교시', '4교시', '5교시', '6교시', '7교시'];
                        const days = ['월', '화', '수', '목', '금'];
                        
                        // 기본 구조 초기화
                        periods.forEach(p => { parsedData[p] = { '월':[], '화':[], '수':[], '목':[], '금':[] }; });

                        json.forEach(row => {
                            const p = row['교시'];
                            if(p && parsedData[p]) {
                                days.forEach(d => {
                                    const val = row[d];
                                    if(val) {
                                        // 쉼표로 분리 후 여백 제거, 빈 값 필터링
                                        parsedData[p][d] = String(val).split(',').map(s => s.trim()).filter(s => s);
                                    }
                                });
                            }
                        });
                        if (type === 'empty2') emptyRoomDataGrade2 = parsedData;
                        else emptyRoomDataGrade3 = parsedData;
                    }
                    saveData(); 
                    showCustomMsg('✅ 성공적으로 엑셀 데이터가 반영되었습니다.'); 
                    e.target.value = ''; 
                    renderContent();
                } catch(err) { 
                    console.error(err);
                    showCustomMsg('❌ 엑셀 데이터 처리 중 오류가 발생했습니다.\n형식이 올바른지 확인해주세요.'); 
                    e.target.value = ''; 
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function confirmResetAllData() {
            showCustomMsg("⚠️ 모든 데이터를 초기화하시겠습니까?\n이 작업은 되돌릴 수 없습니다!", true, (conf) => {
                if (conf) {
                    assignmentData = JSON.parse(JSON.stringify(defaultAssignmentData));
                    emptyRoomDataGrade2 = JSON.parse(JSON.stringify(defaultEmptyRoomDataGrade2));
                    emptyRoomDataGrade3 = JSON.parse(JSON.stringify(defaultEmptyRoomDataGrade3));
                    overlapRecords = []; saveData(); toggleAdminModal(); renderContent();
                    setTimeout(() => showCustomMsg("✅ 초기화가 완료되었습니다."), 300);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => { renderTabs(); renderContent(); });
    </script>
</body>
