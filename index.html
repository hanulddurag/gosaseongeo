<!DOCTYPE html>

<body class="text-gray-800 antialiased min-h-screen p-4 md:p-8">

    <div id="app" class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col">

        <header class="bg-primary text-white p-6 shadow-md relative z-10 flex items-start justify-center">

            <h1 class="text-4xl font-bold tracking-tight text-center leading-none">교과 교실 사용 안내</h1>

        <!-- Main Navigation -->
        <div class="flex justify-center items-center gap-6 border-b border-gray-200 bg-gray-50 py-4 px-6">
            <button onclick="setMainTab('assignment')" id="tab-assignment" class="tab-btn px-8 py-3 text-xl font-bold rounded-xl border-2 transition-all shadow-sm">
                교실 배정 현황
            </button>
            <button onclick="setMainTab('empty')" id="tab-empty" class="tab-btn px-8 py-3 text-xl font-bold rounded-xl border-2 transition-all shadow-sm">
                공강 교실 현황
            </button>
        </div>

        <!-- Content Area -->
        <div id="content-container" class="flex-grow bg-white relative">
            <!-- Dynamic Content Injected Here -->
        </div>
    </div>

    <script>

            { room: "3-1", name: "이명원", subject: "역사", coUser: "<span class='text-blue-600'>홍유리(교양, 월 2, 3)</span>, <span class='text-blue-600'>이창욱(사회 9~10)</span>" },
            { room: "3-1", name: "이창욱", subject: "사회", coUser: "<span class='text-blue-600'>홍유리(교양, 월 2, 3)</span>, <span class='text-blue-600'>이명원(역사 5, 6)</span>, <span class='text-purple-600 font-bold'>스포츠(우천 시, 목 1~2)</span>" },
            { room: "3-1", name: "홍유리", subject: "교양", coUser: "<span class='text-blue-600'>이창욱(사회 9~10)</span>, <span class='text-blue-600'>이명원(역사 5~6)</span>" },
            { room: "3-2", name: "권현지", subject: "과학A", coUser: "손영국(1~4)" },
            { room: "3-2", name: "손영국", subject: "과학A", coUser: "권현지(5~10)" },
            { room: "3-3", name: "옥금숙", subject: "사회, 교양", coUser: "<span class='text-purple-600 font-bold'>스포츠(우천 시, 목 1~2)</span>" },
            { room: "3-4", name: "하나리", subject: "국어A", coUser: "" },
            { room: "3-5", name: "하현경", subject: "수학", coUser: "" },

            { room: "3-7", name: "하성완", subject: "역사, 교양", coUser: "<span class='text-purple-600 font-bold'>스포츠(우천 시, 목 1~2)</span>" },
            { room: "3-8", name: "이정혜", subject: "국어B", coUser: "" },
            { room: "3-9", name: "최희영", subject: "수학", coUser: "" },
            { room: "3-10", name: "최은지", subject: "영어A", coUser: "" },
            { room: "가사실", name: "김경원", subject: "기술가정", coUser: "" },
            { room: "과학실 1(2학년)", name: "신정환", subject: "과학B", coUser: "" },
            { room: "과학실 3", name: "김현정", subject: "과학B", coUser: "" },
            { room: "기술실", name: "김건우", subject: "기술가정", coUser: "문수아(1~7)" },
            { room: "기술실", name: "문수아", subject: "기가, 교양", coUser: "김건우(8~10)" },
            { room: "상상나래실", name: "김건우", subject: "교양", coUser: "<span class='text-blue-600'>교양 월 2, 3</span>, <span class='text-blue-600'>박혜란(2-1~8, 3-1~2)</span>" },
            { room: "상상나래실", name: "박혜란", subject: "음악", coUser: "<span class='text-blue-600'>김건우(교양 월 2, 3)</span>" }
        ];

        const emptyRoomDataGrade2 = {
            '1교시': { '월': ['1','2','8'], '화': ['1','6'], '수': ['1','3','7'], '목': ['1','2','6','9'], '금': ['1','5','6'] },
            '2교시': { '월': ['1','3','5','6','7'], '화': ['3','4','7','9'], '수': ['2','4','7'], '목': ['3','7'], '금': ['1','3','8'] },
            '3교시': { '월': ['4','9'], '화': ['3','5','8','9'], '수': ['5','8','9'], '목': ['4','5','6','8','10'], '금': ['2','3','9','10'] },
            '4교시': { '월': ['5','6','8'], '화': ['2','6','7'], '수': ['1','3','7','10'], '목': ['1','2','3','5','6','8','9','10'], '금': ['4','5','7'] },
            '5교시': { '월': ['3','7','9'], '화': ['3','4','6','7'], '수': ['과제탐구'], '목': ['5','6'], '금': ['4','6','8'] },
            '6교시': { '월': ['4','6','7'], '화': ['2','5','6','8','9'], '수': [], '목': ['8','9'], '금': ['3','6','7','10'] },
            '7교시': { '월': [], '화': ['1'], '수': [], '목': ['1','10'], '금': [] }
        };

        const emptyRoomDataGrade3 = {
            '1교시': { '월': ['1','3','7'], '화': ['2','7','8'], '수': ['1','3','6','10'], '목': ['1','3','5','7','8'], '금': ['1','4'] },
            '2교시': { '월': ['2','5','8'], '화': ['3','7','10'], '수': ['1','4','6','7','10'], '목': ['1','3','4','7','9','10'], '금': ['3','6','9','10'] },
            '3교시': { '월': ['2','4','9','10'], '화': ['3','4','5','9','10'], '수': ['1','2','5','8','9'], '목': ['1','6'], '금': ['1','5','7','8'] },
            '4교시': { '월': ['3','7'], '화': ['1','8','10'], '수': ['1','3','7','9'], '목': ['1','5','8'], '금': ['1','4','9'] },
            '5교시': { '월': ['1','5','9','10'], '화': ['1','2','3','6'], '수': ['과제탐구'], '목': ['3','4','7'], '금': ['1','2','4','7'] },
            '6교시': { '월': ['1','2','4','6','10'], '화': ['1','4','5','7','9'], '수': [], '목': ['2','9','10'], '금': ['1','3','5','8','10'] },
            '7교시': { '월': [], '화': ['1','2','8','10'], '수': [], '목': ['2','5','8','10'], '금': [] }
        };

        let state = {
            mainTab: 'assignment',
            subTab: 'room'
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderContent();
        });

        function setMainTab(tab) {
            state.mainTab = tab;
            if (tab === 'assignment') state.subTab = 'room';
            if (tab === 'empty') state.subTab = 'grade2';
            renderTabs();
            renderContent();
        }

        function setSubTab(tab) {
            state.subTab = tab;
            renderContent();
            updateSubTabUI();
        }

        function renderTabs() {
            const tabs = ['assignment', 'empty'];
            tabs.forEach(tab => {
                const el = document.getElementById(`tab-${tab}`);
                if (state.mainTab === tab) {
                    el.classList.add('bg-primary', 'text-white', 'border-primary', 'shadow-md');
                    el.classList.remove('bg-white', 'text-gray-600', 'border-gray-300', 'hover:bg-gray-100');
                } else {
                    el.classList.remove('bg-primary', 'text-white', 'border-primary', 'shadow-md');
                    el.classList.add('bg-white', 'text-gray-600', 'border-gray-300', 'hover:bg-gray-100');
                }
            });
        }

        function updateSubTabUI() {
            document.querySelectorAll('.sub-tab-btn').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white', 'shadow-md');
                btn.classList.add('bg-white', 'text-gray-600', 'hover:bg-gray-50', 'border', 'border-gray-300');
            });
            const activeBtn = document.getElementById(`subtab-${state.subTab}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-white', 'text-gray-600', 'hover:bg-gray-50', 'border-gray-300');
                activeBtn.classList.add('bg-primary', 'text-white', 'shadow-md', 'border-primary');
            }
        }

        function renderContent() {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            if (state.mainTab === 'assignment') renderAssignmentTab(container);
            else if (state.mainTab === 'empty') renderEmptyRoomTab(container);
        }

        // Custom comparator to ensure 2-10 comes after 2-9 and 3-10 comes after 3-9
        function compareRooms(a, b) {
            const parse = (r) => {
                let match = r.match(/^(\d+)-(\d+)$/);
                if (match) return [parseInt(match[1]), parseInt(match[2])];
                return [99, r];
            };
            const [g1, r1] = parse(a.room);
            const [g2, r2] = parse(b.room);
            if (g1 !== g2) return g1 - g2;
            if (typeof r1 === 'number' && typeof r2 === 'number') return r1 - r2;
            return a.room.localeCompare(b.room);
        }

        function renderAssignmentTab(container) {
            let sortedData = [...assignmentData];
            if (state.subTab === 'teacher') {
                sortedData.sort((a, b) => a.name.localeCompare(b.name));
            } else {
                sortedData.sort(compareRooms);
            }

            let html = `
                <div class="p-6">
                    <div class="flex justify-center space-x-4 mb-6">
                        <button id="subtab-room" onclick="setSubTab('room')" class="sub-tab-btn px-6 py-2.5 rounded-full font-bold text-lg transition-all shadow-sm">교실별</button>
                        <button id="subtab-teacher" onclick="setSubTab('teacher')" class="sub-tab-btn px-6 py-2.5 rounded-full font-bold text-lg transition-all shadow-sm">교사별</button>
                    </div>
                    <div class="flex justify-center">
                        <div class="overflow-x-auto rounded-xl border border-gray-200 shadow-sm w-full">
                            <table class="text-base text-gray-700 min-w-max w-full">
                                <thead class="text-sm bg-gray-100 text-gray-700 border-b-2 border-gray-300">
                                    <tr>
            `;
            
            if (state.subTab === 'room') {
                html += `
                                        <th class="px-4 py-3 text-center font-bold whitespace-nowrap">배정 교실</th>
                                        <th class="px-4 py-3 text-center font-bold whitespace-nowrap">이름</th>
                                        <th class="px-4 py-3 text-center font-bold whitespace-nowrap">교과</th>
                                        <th class="px-6 py-3 text-center font-bold whitespace-nowrap">공동 사용자</th>
                `;
            } else {
                html += `
                                        <th class="px-4 py-3 text-center font-bold whitespace-nowrap">이름</th>
                                        <th class="px-4 py-3 text-center font-bold whitespace-nowrap">배정 교실</th>
                                        <th class="px-4 py-3 text-center font-bold whitespace-nowrap">교과</th>
                                        <th class="px-6 py-3 text-center font-bold whitespace-nowrap">공동 사용자</th>
                `;
            }

            html += `
                                    </tr>
                                </thead>
                                <tbody>
            `;
            
            let prevGroupVal = null;
            let bgClass = "bg-white";
            let altColors = ["bg-white", "bg-green-50"];
            let colorIndex = 0;

            sortedData.forEach((row, index) => {
                let currentGroupVal = state.subTab === 'room' ? row.room : row.name;
                if (index === 0) prevGroupVal = currentGroupVal;
                else if (currentGroupVal !== prevGroupVal) {
                    colorIndex = (colorIndex + 1) % 2;
                    bgClass = altColors[colorIndex];
                    prevGroupVal = currentGroupVal;
                }

                html += `
                    <tr class="${bgClass} border-b border-gray-200 hover:bg-yellow-50 transition-colors">
                `;
                
                if (state.subTab === 'room') {
                    html += `
                        <td class="px-4 py-2 text-center font-bold whitespace-nowrap">${row.room}</td>
                        <td class="px-4 py-2 text-center font-medium whitespace-nowrap">${row.name}</td>
                        <td class="px-4 py-2 text-center whitespace-nowrap">${row.subject}</td>
                        <td class="px-6 py-2 text-center whitespace-nowrap">${row.coUser}</td>
                    `;
                } else {
                    html += `
                        <td class="px-4 py-2 text-center font-medium whitespace-nowrap">${row.name}</td>
                        <td class="px-4 py-2 text-center font-bold whitespace-nowrap">${row.room}</td>
                        <td class="px-4 py-2 text-center whitespace-nowrap">${row.subject}</td>
                        <td class="px-6 py-2 text-center whitespace-nowrap">${row.coUser}</td>
                    `;
                }

                html += `
                    </tr>
                `;
            });

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="mt-8 bg-blue-50 border border-blue-200 rounded-xl p-6 text-base text-gray-800 shadow-sm">
                        <h3 class="font-bold text-base text-primary mb-3 flex items-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            안내 사항
                        </h3>
                        <ul class="list-decimal list-outside ml-5 space-y-2 font-medium">
                            <li>공동 사용자가 없거나 스포츠만 있는 교사와의 시간 변경은 교실 중복이 발생하지 않습니다.</li>
                            <li><strong>월요일 3학년 2~3교시 교양 선택, 목요일 2학년 5~7교시 생활외국어</strong>로 고정된 시간입니다.</li>
                            <li>스포츠(목요일 3학년 1~2교시, 2학년 3~4교시)는 우천 시에만 사용하고 평소에는 다른 교과가 사용 가능합니다.</li>
                            <li>공동 사용자가 있을 경우 교실 중복이 발생할 수 있으니 <strong><a href="https://docs.google.com/spreadsheets/d/1yh6IFIUY3m8w4grOGKedwVk2Kp63oXOfApYzfV7o8QQ/edit?gid=0#gid=0" target="_blank" class="text-blue-700 underline hover:text-blue-900 font-bold">교과 교실 시간표</a></strong>에서 확인 후 진행 바랍니다.</li>
                            <li>진행하시되, 중복이 될 경우 해당 학년 공강 교실 현황표에서 교실 찾아서 수업 진행 (공강 교실 사용하실 때 꼭 해당 교실 주사용자와 상의하시기 바랍니다.)</li>
                            <li><strong>시간이 이동된 사람이 교과 교실을 이동해 주시고 학생들에게 안내해 주기기 바랍니다.</strong></li>
                            <li>문의 사항이 있으시면 정영자(764번)에게 연락주시기 바랍니다.</li>
                        </ul>
                    </div>
                </div>
            `;
            container.innerHTML = html;
            updateSubTabUI();
        }

        function generateEmptyRoomCell(grade, day, period, data) {
            const rooms = data[period][day];
            if (!rooms || rooms.length === 0) return '-';
            if (rooms[0] === '과제탐구') return '<span class="text-gray-500 font-bold whitespace-nowrap">과제탐구</span>';

            return rooms.map(room => {
                let isPurple = false;
                if (day === '목') {
                    if (grade === '3' && (period === '1교시' || period === '2교시') && ['1','3','7'].includes(room)) isPurple = true;
                    if (grade === '2' && (period === '3교시' || period === '4교시') && ['5','6','8'].includes(room)) isPurple = true;
                }
                return isPurple ? `<span class="text-purple-600 font-bold whitespace-nowrap" title="스포츠(우천 시)">${room}</span>` : `<span class="whitespace-nowrap">${room}</span>`;
            }).join(', ');
        }

        function renderEmptyRoomTab(container) {
            const data = state.subTab === 'grade2' ? emptyRoomDataGrade2 : emptyRoomDataGrade3;
            const gradeNum = state.subTab === 'grade2' ? '2' : '3';
            
            let html = `
                <div class="p-6">
                    <div class="flex justify-center space-x-4 mb-6">
                        <button id="subtab-grade2" onclick="setSubTab('grade2')" class="sub-tab-btn px-6 py-2.5 rounded-full font-bold text-lg transition-all shadow-sm">2학년</button>
                        <button id="subtab-grade3" onclick="setSubTab('grade3')" class="sub-tab-btn px-6 py-2.5 rounded-full font-bold text-lg transition-all shadow-sm">3학년</button>
                    </div>

                    <div class="flex justify-center">
                        <div class="overflow-x-auto rounded-xl border-2 border-gray-300 shadow-sm w-fit">
                            <table class="text-base text-gray-700 divide-y-2 divide-gray-300">
                                <thead class="bg-gray-100 text-gray-800 border-b-2 border-gray-400">
                                    <tr class="divide-x-2 divide-gray-300">
                                        <th class="px-5 py-4 w-auto text-center font-bold text-2xl"></th>
                                        <th class="px-6 py-4 text-center font-bold text-2xl whitespace-nowrap">월</th>
                                        <th class="px-6 py-4 text-center font-bold text-2xl whitespace-nowrap">화</th>
                                        <th class="px-6 py-4 text-center font-bold text-2xl whitespace-nowrap">수</th>
                                        <th class="px-6 py-4 text-center font-bold text-2xl whitespace-nowrap">목</th>
                                        <th class="px-6 py-4 text-center font-bold text-2xl whitespace-nowrap">금</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y-2 divide-gray-300 bg-white">
            `;

            ['1교시', '2교시', '3교시', '4교시', '5교시', '6교시', '7교시'].forEach(period => {
                let pNum = period.replace('교시', '');
                html += `<tr class="hover:bg-gray-50 transition-colors divide-x-2 divide-gray-300">`;
                html += `<td class="px-5 py-4 w-auto text-center font-bold text-2xl bg-gray-50 whitespace-nowrap">${pNum}</td>`;
                ['월', '화', '수', '목', '금'].forEach(day => {
                    html += `<td class="px-6 py-4 text-center font-medium text-lg whitespace-nowrap">${generateEmptyRoomCell(gradeNum, day, period, data)}</td>`;
                });
                html += `</tr>`;
            });

            html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="mt-8 bg-gray-50 border border-gray-200 rounded-xl p-5 text-base text-gray-700 shadow-sm flex flex-col md:flex-row gap-4 items-start">
                        <div class="text-primary font-bold whitespace-nowrap flex items-center">
                            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            참고
                        </div>
                        <ul class="list-disc ml-4 space-y-1">
                            <li>DS 1실과 시청각실(주경미), DS 3실(홍지연), 상상나래실(박혜란)은 관리 담당자와 의논한 후 사용.</li>
                            <li><span class="text-purple-600 font-bold">보라색으로 표시된 학급</span>(목요일 3학년 1~2교시, 2학년 3~4교시)은 우천 시 스포츠 사용, 평소에는 사용 가능.</li>
                        </ul>
                    </div>
                </div>
            `;
            container.innerHTML = html;
            updateSubTabUI();
        }
    </script>
</body>
</html>
